[tool.black]
target-version = ["py311"]
line-length = 88
extend-exclude = '/(venv|\.test-venv|\.test-postgres)/'

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["venv", ".test-venv", ".test-postgres"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Model imports register SQLAlchemy tables; these are intentional re-exports.
"app/models/__init__.py" = ["F401"]
"app/db/base.py" = ["F401"]
"alembic/env.py" = ["F401"]
# Test credentials must be set before application imports.
"tests/conftest.py" = ["E402", "F401"]
"tests/postgres/test_migrations.py" = ["F401"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
include_namespace_packages = true
