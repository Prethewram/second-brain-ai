[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    error
    # Passlib imports the deprecated Unix crypt module on Python 3.12.
    # Password hashing uses bcrypt; retain errors for all other warnings.
    ignore:'crypt' is deprecated and slated for removal in Python 3.13:DeprecationWarning
